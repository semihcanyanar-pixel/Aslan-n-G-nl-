<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bebek Günlüğü</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bebek Günlüğü">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F5EEE0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#F5EEE0; --card:#FFFBF3; --ink:#46392E; --ink-soft:#7C6B57; --line:#E4D8C3;
    --blue:#6F9CBD; --blue-deep:#4D7690; --blue-soft:#E4EEF3;
    --gold:#E3A85C; --gold-soft:#FBF0DF;
    --sage:#8FA888; --sage-soft:#E9EFE6;
    --pink:#D98CA0; --pink-soft:#F8E9ED;
    --brass:#B8935A; --danger:#B2554A;
    --radius:22px; --radius-sm:12px;
  }
  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Karla',sans-serif; -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    padding-left:max(30px, calc(env(safe-area-inset-left,0px) + 22px));
    padding-right:env(safe-area-inset-right,0px);
    min-height:100vh;
  }
  h1,h2,.date-label,.day-badge,.btn-primary,.add-btn{ font-family:'Fredoka',sans-serif; }
  button, input, textarea{ font-family:inherit; }
  input, textarea, select{ font-size:16px; } /* keeps iOS Safari from auto-zooming on focus */
  button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--blue-deep); outline-offset:2px;
  }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; animation:none !important; } }

  /* spiral-bound notebook edge */
  .spine{
    position:fixed; left:0; top:0; bottom:0; width:28px;
    background-color:#EFE4CE;
    background-image:radial-gradient(circle 8px at 14px 23px, transparent 0 5px, var(--brass) 5px 8px, transparent 8px);
    background-size:28px 44px; background-repeat:repeat-y;
    z-index:5; pointer-events:none;
  }
  .spine::after{
    content:""; position:absolute; top:0; right:-7px; bottom:0; width:7px;
    background:linear-gradient(to right, rgba(70,57,46,0.12), transparent);
  }

  .loading-screen,.auth-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .loading-screen .moon-mark{ font-size:40px; opacity:.45; }
  .auth-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:34px 24px; width:100%; max-width:360px; text-align:center;
  }
  .auth-card .moon-mark{ font-size:38px; margin-bottom:6px; }
  .auth-card h1{ font-size:21px; margin:0 0 4px; }
  .auth-card p.sub{ color:var(--ink-soft); font-size:14px; margin:0 0 22px; }
  .auth-card input{
    width:100%; padding:13px 14px; margin-bottom:12px; border-radius:var(--radius-sm);
    border:1px solid var(--line); background:#fff; color:var(--ink);
  }
  .btn-primary{
    width:100%; padding:14px; border:none; border-radius:var(--radius-sm);
    background:var(--blue-deep); color:#fff; font-size:16px; font-weight:600; cursor:pointer;
  }
  .btn-primary:active{ transform:scale(.98); }
  .auth-error{ color:var(--danger); font-size:13px; margin-top:12px; min-height:16px; }

  .app-screen{ max-width:560px; margin:0 auto; padding:18px 16px 56px; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:18px; }
  .icon-btn{
    width:40px; height:40px; border-radius:50%; border:1px solid var(--line);
    background:var(--card); color:var(--ink-soft); font-size:15px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .date-nav{ flex:1; display:flex; align-items:center; justify-content:center; gap:4px; }
  .date-nav button{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--line);
    background:var(--card); font-size:17px; color:var(--ink); cursor:pointer; flex-shrink:0;
  }
  .date-center{ text-align:center; padding:2px 10px; cursor:pointer; min-width:150px; }
  .date-label{ font-size:16px; font-weight:600; }
  .day-badge{
    display:inline-block; font-size:11px; color:var(--blue-deep); background:var(--blue-soft);
    padding:2px 9px; border-radius:999px; margin-top:3px;
  }
  #datePicker{ position:absolute; opacity:0; pointer-events:none; width:1px; height:1px; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 16px 20px; margin-bottom:16px; }
  .card h2{ display:flex; align-items:center; gap:10px; font-size:17px; margin:0 0 6px; font-weight:600; }
  .badge{ width:34px; height:34px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
  .card[data-accent="blue"] .badge{ background:var(--blue-soft); }
  .card[data-accent="gold"] .badge{ background:var(--gold-soft); }
  .card[data-accent="sage"] .badge{ background:var(--sage-soft); }
  .card[data-accent="pink"] .badge{ background:var(--pink-soft); }

  .entry-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; padding:14px 0; border-bottom:1px solid var(--line); }
  .entry-row:last-of-type{ border-bottom:none; }
  .field-group{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .field-group label{ font-size:11px; color:var(--ink-soft); }
  .field-group > div{ display:flex; gap:6px; }
  input[type="time"]{ border:1px solid var(--line); border-radius:9px; padding:7px 6px; background:#fff; color:var(--ink); width:100%; min-width:0; }

  .feed-row-extra{ grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:14px 20px; align-items:flex-end; margin-top:2px; }
  .mini-group label{ display:block; font-size:11px; color:var(--ink-soft); margin-bottom:4px; }
  .stepper{ display:flex; align-items:center; gap:8px; background:var(--blue-soft); border-radius:999px; padding:4px; }
  .stepper button{ width:26px; height:26px; border-radius:50%; border:none; background:#fff; color:var(--blue-deep); font-size:16px; line-height:1; cursor:pointer; }
  .stepper .val{ min-width:44px; text-align:center; font-size:13px; font-weight:600; }
  .check-pair{ display:flex; gap:14px; }
  .check-pill{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-soft); cursor:pointer; user-select:none; }
  .check-pill input{ width:17px; height:17px; accent-color:var(--blue-deep); }
  .check-pill.on{ color:var(--ink); font-weight:600; }
  .row-delete{ grid-column:1 / -1; text-align:right; background:none; border:none; color:var(--ink-soft); font-size:12px; padding:2px 0 0; cursor:pointer; }

  .add-btn{ width:100%; margin-top:10px; padding:12px; border-radius:var(--radius-sm); border:1.5px dashed var(--line); background:transparent; color:var(--ink-soft); font-size:14px; font-weight:600; cursor:pointer; }
  .add-btn:active{ transform:scale(.99); }

  .routine-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:0; }
  .routine-list li{ display:flex; align-items:center; gap:12px; padding:11px 2px; border-bottom:1px solid var(--line); cursor:pointer; }
  .routine-list li:last-child{ border-bottom:none; }
  .routine-list input[type="checkbox"]{ width:22px; height:22px; border-radius:50%; accent-color:var(--sage); flex-shrink:0; }
  .card[data-accent="pink"] .routine-list input[type="checkbox"]{ accent-color:var(--pink); }
  .routine-list span{ font-size:15px; }
  .routine-list li.checked span{ text-decoration:line-through; color:var(--ink-soft); }

  .notes-card textarea{ width:100%; min-height:96px; border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px; color:var(--ink); resize:vertical; background:#fff; }

  .sync-status{ text-align:center; font-size:12px; color:var(--ink-soft); padding:10px 0 4px; min-height:18px; }
</style>
</head>
<body>
  <div class="spine" aria-hidden="true"></div>

  <div id="loadingScreen" class="loading-screen"><div class="moon-mark">🌙</div></div>

  <div id="authScreen" class="auth-screen" hidden>
    <div class="auth-card">
      <div class="moon-mark">🌙</div>
      <h1>Bebek Günlüğü</h1>
      <p class="sub">Devam etmek için giriş yapın</p>
      <input type="email" id="emailInput" placeholder="E-posta" autocomplete="email" inputmode="email">
      <input type="password" id="passwordInput" placeholder="Şifre" autocomplete="current-password">
      <button class="btn-primary" id="loginBtn" type="button">Giriş yap</button>
      <p class="auth-error" id="authError"></p>
    </div>
  </div>

  <div id="appScreen" class="app-screen" hidden>
    <header class="topbar">
      <button class="icon-btn" id="logoutBtn" type="button" aria-label="Çıkış yap" title="Çıkış yap">⏻</button>
      <div class="date-nav">
        <button id="prevDayBtn" type="button" aria-label="Önceki gün">‹</button>
        <div class="date-center" id="dateCenter">
          <div class="date-label" id="dateLabel">—</div>
          <span class="day-badge" id="dayBadge" style="display:none"></span>
        </div>
        <button id="nextDayBtn" type="button" aria-label="Sonraki gün">›</button>
      </div>
      <div style="width:40px" aria-hidden="true"></div>
    </header>
    <input type="date" id="datePicker" aria-hidden="true">

    <main>
      <section class="card" data-accent="blue">
        <h2><span class="badge">🍼</span> Emzirme</h2>
        <div id="feedList"></div>
        <button class="add-btn" id="addFeedBtn" type="button">+ Emzirme ekle</button>
      </section>

      <section class="card" data-accent="gold">
        <h2><span class="badge">🌙</span> Uyku</h2>
        <div id="sleepList"></div>
        <button class="add-btn" id="addSleepBtn" type="button">+ Uyku ekle</button>
      </section>

      <section class="card" data-accent="sage">
        <h2><span class="badge">🌱</span> Bebeğin günü</h2>
        <ul class="routine-list" id="babyRoutineList"></ul>
      </section>

      <section class="card" data-accent="pink">
        <h2><span class="badge">🌸</span> Annenin günü</h2>
        <ul class="routine-list" id="momRoutineList"></ul>
      </section>

      <section class="card notes-card" data-accent="ink">
        <h2><span class="badge">✎</span> Notlar</h2>
        <textarea id="notesInput" placeholder="Bugün nasıl geçti?"></textarea>
      </section>
    </main>

    <div class="sync-status" id="syncStatus"></div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import {
  getFirestore, doc, onSnapshot, setDoc
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

/* ========================================================================
   1) FIREBASE CONFIG — Firebase Console → Project settings → your web app
      → "SDK setup and configuration" → Config. Paste your real values below.
      (These values are meant to be public in client code — see README.)
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyAE2GkRQ6OF_ziW6Tt9g3RDfJjXjeBnQhI",
  authDomain: "aslan-d1742.firebaseapp.com",
  projectId: "aslan-d1742",
  storageBucket: "aslan-d1742.firebasestorage.app",
  messagingSenderId: "964083447881",
  appId: "1:964083447881:web:4ba105f325f444b4542798"
};
const NOT_CONFIGURED = firebaseConfig.apiKey.startsWith("BURAYA_");

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ========================================================================
   2) Notebook'taki sabit rutin listeleri
   ===================================================================== */
const BABY_ROUTINE = [
  { key:"yuzYikama", label:"Yüz yıkama" },
  { key:"vitaminD", label:"D vitamini" },
  { key:"probiyotik", label:"Probiyotik" },
  { key:"gazDamlasi", label:"Gaz damlası" },
  { key:"sohbet", label:"Bebekle sohbet" },
  { key:"zekaKartlari", label:"Zeka kartları" },
  { key:"disariCikarma", label:"Dışarı çıkarma" },
  { key:"banyo", label:"Banyo" }
];
const MOM_ROUTINE = [
  { key:"su", label:"2,5–3,5 litre su" },
  { key:"vitamin", label:"Vitamin" },
  { key:"banyo", label:"Banyo" },
  { key:"gogusBakimi", label:"Göğüs ucu bakımı" }
];

/* ========================================================================
   3) Tarih yardımcıları — YEREL tarihle çalışır (UTC kaymasını önler)
   ===================================================================== */
function toDateStr(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function todayStr(){ return toDateStr(new Date()); }
function shiftDate(dateStr, delta){
  const [y,m,d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate()+delta);
  return toDateStr(dt);
}
function nowTimeStr(){
  const d = new Date();
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
const MONTHS = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
function formatDateLabel(dateStr){
  const [y,m,d] = dateStr.split("-").map(Number);
  return `${d} ${MONTHS[m-1]} ${y}`;
}

/* ========================================================================
   4) State
   ===================================================================== */
let currentDate = todayStr();
let dayData = emptyDay();
let unsubscribeDay = null;
let saveTimer = null;

function emptyDay(){
  const baby = {}; BABY_ROUTINE.forEach(i => baby[i.key] = false);
  const mom = {}; MOM_ROUTINE.forEach(i => mom[i.key] = false);
  return { feedings:[], sleeps:[], babyRoutine:baby, momRoutine:mom, notes:"" };
}

/* ========================================================================
   5) Auth
   ===================================================================== */
const loadingScreen = document.getElementById("loadingScreen");
const authScreen = document.getElementById("authScreen");
const appScreen = document.getElementById("appScreen");
const authError = document.getElementById("authError");

if (NOT_CONFIGURED){
  authError.textContent = "Önce firebaseConfig değerlerini index.html içine girin (bkz. README.md).";
}

document.getElementById("loginBtn").addEventListener("click", doLogin);
document.getElementById("passwordInput").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

async function doLogin(){
  const email = document.getElementById("emailInput").value.trim();
  const pass = document.getElementById("passwordInput").value;
  if (!email || !pass){ authError.textContent = "E-posta ve şifre gerekli."; return; }
  authError.textContent = "";
  try{
    await signInWithEmailAndPassword(auth, email, pass);
  }catch(e){
    authError.textContent = "Giriş başarısız. E-posta/şifreyi kontrol edin.";
  }
}
document.getElementById("logoutBtn").addEventListener("click", () => signOut(auth));

onAuthStateChanged(auth, (user) => {
  loadingScreen.hidden = true;
  if (user){
    authScreen.hidden = true;
    appScreen.hidden = false;
    loadDate(currentDate);
  } else {
    authScreen.hidden = false;
    appScreen.hidden = true;
    if (unsubscribeDay){ unsubscribeDay(); unsubscribeDay = null; }
  }
});

/* ========================================================================
   6) Tarih gezinme
   ===================================================================== */
const dateLabelEl = document.getElementById("dateLabel");
const dayBadgeEl = document.getElementById("dayBadge");
const datePicker = document.getElementById("datePicker");

document.getElementById("prevDayBtn").addEventListener("click", () => loadDate(shiftDate(currentDate,-1)));
document.getElementById("nextDayBtn").addEventListener("click", () => loadDate(shiftDate(currentDate,1)));
document.getElementById("dateCenter").addEventListener("click", () => {
  datePicker.value = currentDate;
  if (datePicker.showPicker) datePicker.showPicker(); else datePicker.focus();
});
datePicker.addEventListener("change", (e) => { if (e.target.value) loadDate(e.target.value); });

function loadDate(dateStr){
  currentDate = dateStr;
  dateLabelEl.textContent = formatDateLabel(dateStr);
  if (dateStr === todayStr()){ dayBadgeEl.textContent = "Bugün"; dayBadgeEl.style.display = "inline-block"; }
  else if (dateStr === shiftDate(todayStr(),-1)){ dayBadgeEl.textContent = "Dün"; dayBadgeEl.style.display = "inline-block"; }
  else { dayBadgeEl.style.display = "none"; }

  if (unsubscribeDay) unsubscribeDay();
  dayData = emptyDay();
  render();
  setSyncStatus("Yükleniyor…", false);

  const ref = doc(db, "days", dateStr);
  unsubscribeDay = onSnapshot(ref, (snap) => {
    if (snap.exists()){
      const d = snap.data();
      dayData = {
        feedings: d.feedings || [],
        sleeps: d.sleeps || [],
        babyRoutine: { ...emptyDay().babyRoutine, ...(d.babyRoutine||{}) },
        momRoutine: { ...emptyDay().momRoutine, ...(d.momRoutine||{}) },
        notes: d.notes || ""
      };
    } else {
      dayData = emptyDay();
    }
    render();
    setSyncStatus("", false);
  }, () => {
    setSyncStatus("Bağlantı sorunu — internet bağlantınızı kontrol edin", true);
  });
}

/* ========================================================================
   7) Kayıt (debounce'lı otomatik kaydetme)
   ===================================================================== */
function scheduleSave(){
  setSyncStatus("Kaydediliyor…", false);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 600);
}
async function saveNow(){
  try{
    await setDoc(doc(db,"days",currentDate), { ...dayData, updatedAt:new Date().toISOString() });
    setSyncStatus("Kaydedildi ✓", false);
  }catch(e){
    setSyncStatus("Kaydedilemedi — tekrar denenecek", true);
  }
}
function setSyncStatus(text, isError){
  const el = document.getElementById("syncStatus");
  el.textContent = text;
  el.style.color = isError ? "var(--danger)" : "";
}

/* ========================================================================
   8) Render
   ===================================================================== */
function render(){
  renderFeedList();
  renderSleepList();
  renderRoutineList("babyRoutineList", BABY_ROUTINE, dayData.babyRoutine, "babyRoutine");
  renderRoutineList("momRoutineList", MOM_ROUTINE, dayData.momRoutine, "momRoutine");
  const notesInput = document.getElementById("notesInput");
  if (document.activeElement !== notesInput) notesInput.value = dayData.notes;
}

function renderFeedList(){
  const wrap = document.getElementById("feedList");
  wrap.innerHTML = "";
  dayData.feedings.forEach((f, idx) => {
    const row = document.createElement("div");
    row.className = "entry-row";
    row.innerHTML = `
      <div class="field-group">
        <label>Sağ meme</label>
        <div><input type="time" data-field="rightStart" value="${f.rightStart||""}"><input type="time" data-field="rightEnd" value="${f.rightEnd||""}"></div>
      </div>
      <div class="field-group">
        <label>Sol meme</label>
        <div><input type="time" data-field="leftStart" value="${f.leftStart||""}"><input type="time" data-field="leftEnd" value="${f.leftEnd||""}"></div>
      </div>
      <div class="feed-row-extra">
        <div class="mini-group">
          <label>Ek süt</label>
          <div class="stepper" data-field="extraCc">
            <button type="button" class="dec" aria-label="Azalt">–</button>
            <span class="val">${f.extraCc||0} cc</span>
            <button type="button" class="inc" aria-label="Artır">+</button>
          </div>
        </div>
        <div class="mini-group">
          <label>&nbsp;</label>
          <div class="check-pair">
            <label class="check-pill ${f.pee?"on":""}"><input type="checkbox" data-field="pee" ${f.pee?"checked":""}> Çiş</label>
            <label class="check-pill ${f.poop?"on":""}"><input type="checkbox" data-field="poop" ${f.poop?"checked":""}> Kaka</label>
          </div>
        </div>
        <div class="mini-group">
          <label>Sağılan</label>
          <div class="stepper" data-field="pumpedCc">
            <button type="button" class="dec" aria-label="Azalt">–</button>
            <span class="val">${f.pumpedCc||0} cc</span>
            <button type="button" class="inc" aria-label="Artır">+</button>
          </div>
        </div>
      </div>
      <button type="button" class="row-delete">Bu kaydı sil</button>
    `;
    row.querySelectorAll('input[type="time"]').forEach(inp => {
      inp.addEventListener("change", () => { dayData.feedings[idx][inp.dataset.field] = inp.value; scheduleSave(); });
    });
    row.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.addEventListener("change", () => {
        dayData.feedings[idx][cb.dataset.field] = cb.checked;
        cb.closest(".check-pill").classList.toggle("on", cb.checked);
        scheduleSave();
      });
    });
    row.querySelectorAll(".stepper").forEach(st => {
      const field = st.dataset.field;
      st.querySelector(".inc").addEventListener("click", () => {
        dayData.feedings[idx][field] = (dayData.feedings[idx][field]||0) + 5;
        st.querySelector(".val").textContent = dayData.feedings[idx][field] + " cc";
        scheduleSave();
      });
      st.querySelector(".dec").addEventListener("click", () => {
        dayData.feedings[idx][field] = Math.max(0,(dayData.feedings[idx][field]||0) - 5);
        st.querySelector(".val").textContent = dayData.feedings[idx][field] + " cc";
        scheduleSave();
      });
    });
    row.querySelector(".row-delete").addEventListener("click", () => {
      dayData.feedings.splice(idx,1);
      renderFeedList();
      scheduleSave();
    });
    wrap.appendChild(row);
  });
}

document.getElementById("addFeedBtn").addEventListener("click", () => {
  dayData.feedings.push({ rightStart:nowTimeStr(), rightEnd:"", leftStart:"", leftEnd:"", extraCc:0, pee:false, poop:false, pumpedCc:0 });
  renderFeedList();
  scheduleSave();
});

function renderSleepList(){
  const wrap = document.getElementById("sleepList");
  wrap.innerHTML = "";
  dayData.sleeps.forEach((s, idx) => {
    const row = document.createElement("div");
    row.className = "entry-row";
    row.innerHTML = `
      <div class="field-group"><label>Uyudu</label><div><input type="time" data-field="sleepTime" value="${s.sleepTime||""}"></div></div>
      <div class="field-group"><label>Uyandı</label><div><input type="time" data-field="wakeTime" value="${s.wakeTime||""}"></div></div>
      <button type="button" class="row-delete">Bu kaydı sil</button>
    `;
    row.querySelectorAll('input[type="time"]').forEach(inp => {
      inp.addEventListener("change", () => { dayData.sleeps[idx][inp.dataset.field] = inp.value; scheduleSave(); });
    });
    row.querySelector(".row-delete").addEventListener("click", () => {
      dayData.sleeps.splice(idx,1);
      renderSleepList();
      scheduleSave();
    });
    wrap.appendChild(row);
  });
}
document.getElementById("addSleepBtn").addEventListener("click", () => {
  dayData.sleeps.push({ sleepTime:nowTimeStr(), wakeTime:"" });
  renderSleepList();
  scheduleSave();
});

function renderRoutineList(elId, defs, stateObj, stateKey){
  const ul = document.getElementById(elId);
  ul.innerHTML = "";
  defs.forEach(item => {
    const checked = !!stateObj[item.key];
    const li = document.createElement("li");
    li.className = checked ? "checked" : "";
    li.innerHTML = `<input type="checkbox" ${checked?"checked":""}><span>${item.label}</span>`;
    const cb = li.querySelector("input");
    const toggle = () => {
      dayData[stateKey][item.key] = cb.checked;
      li.classList.toggle("checked", cb.checked);
      scheduleSave();
    };
    cb.addEventListener("change", toggle);
    li.addEventListener("click", (e) => { if (e.target !== cb){ cb.checked = !cb.checked; toggle(); } });
    ul.appendChild(li);
  });
}

document.getElementById("notesInput").addEventListener("input", (e) => {
  dayData.notes = e.target.value;
  scheduleSave();
});

/* ========================================================================
   9) Service worker (uygulama kabuğunu önbelleğe alır)
   ===================================================================== */
if ("serviceWorker" in navigator){
  window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(()=>{}); });
}
</script>
